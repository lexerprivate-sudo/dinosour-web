name: Dinosour CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Unit/API tests
        run: |
          node server.js > ci-server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3210/api/ping > /dev/null && break
            sleep 1
          done
          npm test
