<a class="skip-link" href="#main">Skip to content</a>
<header class="header">
  <div class="header-start">
    <button class="icon-button" id="menu-toggle" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="true" title="Toggle navigation"><svg class="icon"><use href="#i-menu"/></svg></button>
    <a class="brand" href="#home" aria-label="Dinosour home"><img src="/icon.svg" alt="" width="33" height="24"><span>Dinosour</span></a>
  </div>
  <div class="search-wrap">
    <form id="search-form" role="search">
      <input id="search" aria-label="Search YouTube or paste a video link" placeholder="Search" autocomplete="off" maxlength="200" aria-autocomplete="list" aria-controls="search-suggestions" aria-expanded="false">
      <button id="clear-search" type="button" class="icon-button" aria-label="Clear search" hidden><svg class="icon"><use href="#i-close"/></svg></button>
      <button class="search-submit" aria-label="Search" title="Search" type="submit"><svg class="icon"><use href="#i-search"/></svg></button>
    </form>
    <div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions" hidden></div>
  </div>
  <div class="header-actions">
    <button class="icon-button" id="share-app" aria-label="Share this server" title="Share this server"><svg class="icon"><use href="#i-share"/></svg></button>
    <button class="icon-button" id="theme-toggle" aria-label="Switch to light theme" title="Switch to light theme"><svg class="icon"><use href="#i-sun"/></svg></button>
    <button class="icon-button" id="android-settings" aria-label="Android app settings" title="Android app settings" hidden><svg class="icon"><use href="#i-settings"/></svg></button>
    <a class="library-link" href="#saved" title="Your local library"><svg class="icon"><use href="#i-library"/></svg><span>Your library</span></a>
  </div>
</header>
<button class="nav-scrim" id="nav-scrim" aria-label="Close navigation" tabindex="-1" hidden></button>
<aside class="sidebar" id="sidebar">
  <nav aria-label="Main navigation">
    <div class="nav-group primary-nav">
      <a href="#home" data-nav="home" title="Home"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></a>
      <a href="#shorts" data-nav="shorts" title="Shorts"><svg class="icon"><use href="#i-shorts"/></svg><span>Shorts</span></a>
      <a href="#history" data-nav="history" title="History"><svg class="icon"><use href="#i-history"/></svg><span>History</span></a>
      <a href="#saved" data-nav="saved" title="Watch later"><svg class="icon"><use href="#i-clock"/></svg><span>Watch later</span><small id="saved-count">0</small></a>
      <a href="#liked" data-nav="liked" title="Liked videos"><svg class="icon"><use href="#i-like"/></svg><span>Liked videos</span></a>
    </div>
    <div class="nav-group explore-nav" id="topic-navigation"></div>
  </nav>
  <div class="sidebar-footer"><strong>Your videos. Your space.</strong><p>Your library is saved on this device.<br>No account needed.</p><button class="sidebar-backup" type="button" data-backup>Back up library</button><span>Independent YouTube viewer</span></div>
</aside>
<main id="main" tabindex="-1"></main>
<dialog id="topic-dialog" aria-labelledby="topic-dialog-title">
  <form id="topic-form">
    <div class="dialog-heading"><h2 id="topic-dialog-title">Add a topic</h2><button class="icon-button" id="close-topic" type="button" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <p>Make your feed yours. Add anything you like watching.</p>
    <label for="topic-name">Topic name</label>
    <input id="topic-name" name="topic" placeholder="e.g. Football, space, piano lessons" maxlength="80" required autocomplete="off">
    <div class="dialog-actions"><button id="cancel-topic" type="button">Cancel</button><button class="primary" type="submit">Add topic</button></div>
  </form>
</dialog>
<div id="toast" role="status"></div>
</body>
</html>
